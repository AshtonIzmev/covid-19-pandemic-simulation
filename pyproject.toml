[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandemic-simulation"
version = "0.3.0"
description = "\"Life simulation\" of a SEIR inspired model to better understand pandemic using python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "AshtonIzmev" }]
keywords = ["covid-19", "pandemic", "simulation", "epidemiology", "seir", "agent-based-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "psutil>=5.9",
    "ray>=2.9",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/AshtonIzmev/covid-19-pandemic-simulation"
Repository = "https://github.com/AshtonIzmev/covid-19-pandemic-simulation"

[tool.setuptools.packages.find]
include = ["simulator*", "scenario*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["simulator", "scenario"]
omit = ["*/animation.py"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",    # function call in default argument
    "SIM108",  # ternary instead of if/else is not always clearer here
    "C401",    # generator vs set comprehension
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
